name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: healthcare
      MONGO_COLLECTION: patients

    steps:
      # Clone le dépôt GitHub dans la machine GitHub Actions
      - name: Récupération du code source depuis GitHub
        uses: actions/checkout@v4
        
      # Installe et configure les versions de Python demandées
      - name: Configuration de l’environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installe toutes les dépendances Python nécessaires au projet
      - name: Installation des dépendences
        run: |
          python -m pip install --upgrade pip
          pip install -r migration/requirements.txt

      # Exécute tous les tests unitaires contenus dans le dossier unit_tests/
      - name: Tests unitaires
        run: |
          python -m unittest discover -s unit_tests -p "test_*.py" -v

      # Insérer un jeu de données dans la base afin de permettre l’exécution de tests d’intégrité
      - name: Charger un échantillon de données limité à 1000 documents
        run: |
          python - <<'PY'
          import csv
          from pymongo import MongoClient
          from migration.import_healthcare_dataset_to_mongodb import convert_type

          mongo_uri = "mongodb://localhost:27017"
          db_name = "healthcare"
          col_name = "patients"

          client = MongoClient(mongo_uri)
          col = client[db_name][col_name]
          col.delete_many({})

          path = "data/healthcare_dataset.csv"
          docs = []
          with open(path, newline="", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              for i, row in enumerate(reader):
                  # Keep CI fast: load only a small sample.
                  if i >= 1000:
                      break
                  doc = {k: convert_type(k, v) for k, v in row.items()}
                  docs.append(doc)

          if docs:
              col.insert_many(docs, ordered=False)

          print(f"Inserted {len(docs)} documents into {db_name}.{col_name}")
          PY

      # Vérifier que les données stockées respectent des règles de qualité et de cohérence
      - name: Tests d'intégrité
        run: |
          python integrity_checks_mongodb.py --mongo-uri "${MONGO_URI}" --db "${MONGO_DB}" --collection "${MONGO_COLLECTION}" --fail-on-missing  --fail-on-type --fail-on-sanity
