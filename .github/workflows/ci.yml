# ======================================================================
# CI GitHub Actions – Version 1.3.0
# ----------------------------------------------------------------------
# Ce pipeline CI a pour objectif de :
#  - vérifier automatiquement la qualité du code Python
#  - exécuter les tests unitaires à chaque push et pull request
#  - garantir la non-régression avant une release GitHub
# ======================================================================

name: CI

# ----------------------------------------------------------------------
# Déclencheurs du workflow
# ----------------------------------------------------------------------
# Le pipeline est lancé automatiquement :
#  - à chaque push sur le dépôt
#  - à chaque pull request (demande de fusion)
# ----------------------------------------------------------------------
on:
  push:
  pull_request:

# ----------------------------------------------------------------------
# Définition des jobs CI
# ----------------------------------------------------------------------
jobs:
  tests:
    # Environnement Linux fourni par GitHub Actions
    runs-on: ubuntu-latest

    # ------------------------------------------------------------------
    # Exécution du même job sur plusieurs versions de Python
    # Objectif : garantir la compatibilité du code
    # ------------------------------------------------------------------
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    # ------------------------------------------------------------------
    # Étapes du job
    # ------------------------------------------------------------------
    steps:
      # --------------------------------------------------------------
      # Étape 1 : Récupération du code source
      # --------------------------------------------------------------
      # Clone le dépôt GitHub dans l’environnement du runner
      # --------------------------------------------------------------
      - name: Récupération du code source
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # Étape 2 : Installation de Python
      # --------------------------------------------------------------
      # Installe la version de Python définie dans la matrice
      # (3.11 puis 3.12)
      # --------------------------------------------------------------
      - name: Configuration de l’environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # --------------------------------------------------------------
      # Étape 3 : Installation des dépendances Python
      # --------------------------------------------------------------
      # - Mise à jour de pip
      # - Installation des dépendances nécessaires aux tests
      # --------------------------------------------------------------
      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r migration/requirements.txt

      # --------------------------------------------------------------
      # Étape 4 : Exécution des tests unitaires
      # --------------------------------------------------------------
      # Lance automatiquement tous les tests :
      #  - situés dans le dossier unit_tests/
      #  - dont le nom commence par test_
      #
      # Options utilisées :
      #  - -m unittest        : lance le framework unittest
      #  - discover           : recherche automatique des tests
      #  - -s unit_tests      : dossier racine des tests
      #  - -p "test_*.py"     : filtre de sélection (motif de nommage) des fichiers de tests
      #  - -v                 : mode verbeux (détail de l'exécution des tests)
      # --------------------------------------------------------------
      - name: Exécution des tests unitaires
        run: |
          python -m unittest discover -s unit_tests -p "test_*.py" -v
